<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a14">
    <title>Tetris • ABDULLAH BIN FAHAD</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            width:100%; height:100%; overflow:hidden; position:fixed; top:0; left:0; right:0; bottom:0;
            background: #0a0a14; font-family:'Poppins',sans-serif; touch-action:manipulation;
            -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
            -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
        }
        .game-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        }
        canvas#gameCanvas {
            display: block;
            background: #0d0d20;
            border: none;
            outline: none;
            image-rendering: auto;
            /* On desktop, the canvas is sized via JS and centered */
        }

        /* Overlay buttons (pause, soft/hard drop) */
        .overlay-btn {
            position: fixed; z-index:20; pointer-events:auto;
            background: rgba(255,255,255,0.2); border:2px solid rgba(255,255,255,0.4);
            border-radius:50%; color:#fff; font-size:20px;
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; transition:0.15s; touch-action:manipulation;
            -webkit-tap-highlight-color:transparent; user-select:none;
        }
        .overlay-btn:active { background:rgba(255,255,255,0.4); transform:scale(0.9); }
        #pauseBtn { top: 10px; right: 80px; width:36px; height:36px; font-size:14px; font-weight:700; background:#00e5ff; color:#000; border:none; border-radius:8px; display:none; }
        #softDropBtn { bottom: 80px; left: 20px; width:44px; height:44px; }
        #hardDropBtn { bottom: 80px; right: 20px; width:44px; height:44px; }
        #softDropBtn::after { content:'↓'; font-size:24px; }
        #hardDropBtn::after { content:'🏃‍♂️'; font-size:22px; }

        .big-action-btn {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
            padding:16px 32px; font-size:clamp(18px,4vw,28px); font-weight:700; letter-spacing:2px;
            border:none; border-radius:16px; cursor:pointer; background:#39ff14; color:#000;
            box-shadow:0 0 25px rgba(57,255,20,0.6); z-index:30; font-family:'Fredoka One',cursive;
            display:none; text-transform:uppercase;
        }
        .big-action-btn:active { transform:translate(-50%,-50%) scale(0.95); }

        /* Pause blur */
        .pause-blur {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.55); backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
            z-index:15; display:none; pointer-events:none;
        }

        @media (min-width: 769px) {
            /* Desktop: only board, centered, no extra elements */
            .game-container { padding: 0; }
            canvas#gameCanvas { border-radius: 8px; box-shadow: 0 0 30px rgba(100,100,255,0.3); }
            #softDropBtn, #hardDropBtn { display: none; }  /* hide mobile buttons on desktop */
        }
    </style>
</head>
<body>
    <div class="game-container" id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <button class="overlay-btn" id="pauseBtn">⏸</button>
        <button class="overlay-btn" id="softDropBtn"></button>
        <button class="overlay-btn" id="hardDropBtn"></button>
    </div>
    <div class="pause-blur" id="pauseBlur"></div>
    <button class="big-action-btn" id="bigActionBtn">Start</button>

    <script>
        (function() {
            'use strict';

            // ===================== AUDIO =====================
            let audioCtx;
            function initAudio() { if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)(); }
            function playBeep(freq, dur, type='square', vol=0.08) {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + dur);
                } catch(e) {}
            }
            function sfxMove() { playBeep(300,0.05,'sine',0.05); }
            function sfxRotate() { playBeep(500,0.06,'sine',0.06); }
            function sfxDrop() { playBeep(150,0.1,'triangle',0.1); }
            function sfxClear(n) { for (let i=0;i<n;i++) setTimeout(()=>playBeep(600+i*150,0.12,'square',0.1), i*80); }
            function sfxLevelUp() { playBeep(800,0.1,'triangle',0.12); setTimeout(()=>playBeep(1000,0.1,'triangle',0.12),100); }
            function sfxGameOver() { playBeep(200,0.3,'sawtooth',0.2); playBeep(150,0.4,'sawtooth',0.18); }

            // ===================== CANVAS SETUP =====================
            const gameCanvas = document.getElementById('gameCanvas');
            const ctx = gameCanvas.getContext('2d');

            const COLS = 10, ROWS = 20;
            const BOTTOM_OBSTACLE_ROWS = 2;  // 2 rows of dark bricks at the bottom
            const PLAYABLE_ROWS = ROWS - BOTTOM_OBSTACLE_ROWS; // 18 rows where pieces move

            let CELL_SIZE, boardWidth, boardHeight;
            let canvasWidth, canvasHeight;
            let boardOffsetX = 0, boardOffsetY = 0;

            function resizeCanvas() {
                const isMobile = window.innerWidth < 769;
                if (isMobile) {
                    canvasWidth = document.documentElement.clientWidth;
                    canvasHeight = document.documentElement.clientHeight;
                } else {
                    // Desktop: board takes 55% of width, 85% of height, centered
                    canvasWidth = window.innerWidth * 0.55;
                    canvasHeight = window.innerHeight * 0.85;
                }
                gameCanvas.width = canvasWidth;
                gameCanvas.height = canvasHeight;
                gameCanvas.style.width = canvasWidth + 'px';
                gameCanvas.style.height = canvasHeight + 'px';

                // Calculate cell size to fit board within canvas
                const maxCellW = canvasWidth / COLS;
                const maxCellH = canvasHeight / ROWS;
                CELL_SIZE = Math.min(maxCellW, maxCellH);
                boardWidth = CELL_SIZE * COLS;
                boardHeight = CELL_SIZE * ROWS;
                boardOffsetX = (canvasWidth - boardWidth) / 2;
                boardOffsetY = (canvasHeight - boardHeight) / 2;
            }
            resizeCanvas();
            window.addEventListener('resize', () => { resizeCanvas(); drawAll(); });
            window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

            // ===================== GAME STATE =====================
            const SHAPES = [
                { name:'I', cells:[[0,0],[0,1],[0,2],[0,3]], color:'#00e5ff' },
                { name:'O', cells:[[0,0],[0,1],[1,0],[1,1]], color:'#ffd700' },
                { name:'T', cells:[[0,0],[0,1],[0,2],[1,1]], color:'#b44dff' },
                { name:'S', cells:[[0,1],[0,2],[1,0],[1,1]], color:'#39ff14' },
                { name:'Z', cells:[[0,0],[0,1],[1,1],[1,2]], color:'#ff2d78' },
                { name:'J', cells:[[0,0],[1,0],[1,1],[1,2]], color:'#0077ff' },
                { name:'L', cells:[[0,2],[1,0],[1,1],[1,2]], color:'#ff8c00' },
            ];

            let board = [];             // 2D array (ROWS x COLS) null or color
            let currentPiece = null;
            let nextPiece = null;
            let score = 0, level = 1, lines = 0;
            let gameRunning = false, gamePaused = false, gameOver = false;
            let dropInterval = 800, lastDropTime = 0;
            let animationId = null;
            let particles = [];
            let specialMessageTimer = 0, lastMilestoneScore = 0;
            const SCORE_MILESTONES = [1000,5000,10000,20000,30000,40000,50000,75000,100000];
            const congratsMessages = [
                "ABDULLAH BIN FAHAD THINKS YOU'RE GREAT! 🌟",
                "ABDULLAH BIN FAHAD SAYS YOU'RE A GENIUS! 🧠",
                "ABDULLAH BIN FAHAD THINKS YOU'RE AMAZING! 💫",
                "ABDULLAH BIN FAHAD CALLS YOU A LEGEND! 👑",
                "ABDULLAH BIN FAHAD SAYS YOU'RE UNSTOPPABLE! 🔥",
                "ABDULLAH BIN FAHAD THINKS YOU'RE INCREDIBLE! ⚡",
                "ABDULLAH BIN FAHAD SAYS YOU'RE A MASTER! 🏆",
                "ABDULLAH BIN FAHAD THINKS YOU'RE PHENOMENAL! 🌈",
                "ABDULLAH BIN FAHAD SAYS YOU'RE THE BEST! 💎",
                "ABDULLAH BIN FAHAD THINKS YOU'RE A PRODIGY! 🎯",
            ];
            let lastCongratsIndex = -1;

            function initBoard() {
                board = Array.from({length: ROWS}, (_, r) => {
                    // Fill bottom obstacle rows with dark color
                    if (r >= ROWS - BOTTOM_OBSTACLE_ROWS) {
                        return Array(COLS).fill('#1a1a1a'); // dark brick
                    }
                    return Array(COLS).fill(null);
                });
            }

            function randomPiece() {
                const s = SHAPES[Math.floor(Math.random()*SHAPES.length)];
                return {
                    cells: s.cells.map(c=>[c[0],c[1]]),
                    color: s.color,
                    name: s.name,
                    row: 0,
                    col: Math.floor(COLS/2)-1
                };
            }

            function rotatePiece(piece) {
                if (piece.name==='O') return piece.cells.map(c=>[c[0],c[1]]);
                const newCells = piece.cells.map(c=>[c[1],-c[0]]);
                const minR = Math.min(...newCells.map(c=>c[0]));
                const minC = Math.min(...newCells.map(c=>c[1]));
                return newCells.map(c=>[c[0]-minR, c[1]-minC]);
            }

            function isValidPosition(cells, row, col) {
                for (const [dr,dc] of cells) {
                    const r = row + dr, c = col + dc;
                    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
                    if (board[r][c] !== null) return false;
                }
                return true;
            }

            function placePiece() {
                for (const [dr,dc] of currentPiece.cells) {
                    const r = currentPiece.row + dr, c = currentPiece.col + dc;
                    if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                        board[r][c] = currentPiece.color;
                    }
                }
            }

            function clearLines() {
                let cleared = 0;
                // Only check playable rows (top PLAYABLE_ROWS rows)
                for (let r = PLAYABLE_ROWS - 1; r >= 0; r--) {
                    if (board[r].every(cell => cell !== null && cell !== '#1a1a1a')) {
                        // Spawn particles for each cell in the row
                        for (let c = 0; c < COLS; c++) {
                            spawnParticles(c*CELL_SIZE+CELL_SIZE/2, r*CELL_SIZE+CELL_SIZE/2, board[r][c]);
                        }
                        // Remove row and add empty row at top
                        board.splice(r, 1);
                        board.unshift(Array(COLS).fill(null));
                        cleared++;
                        r++; // recheck this index
                    }
                }
                return cleared;
            }

            function spawnParticles(x,y,color) {
                for (let i=0;i<6;i++) particles.push({
                    x, y, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6-3,
                    life:30+Math.random()*20, maxLife:50, color, r:2+Math.random()*3
                });
            }
            function updateParticles() {
                for (let i=particles.length-1;i>=0;i--) {
                    const p = particles[i];
                    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
                    if (p.life <= 0) particles.splice(i,1);
                }
            }

            function spawnPiece() {
                if (nextPiece === null) nextPiece = randomPiece();
                currentPiece = nextPiece;
                currentPiece.row = 0;
                currentPiece.col = Math.floor(COLS/2)-1;
                nextPiece = randomPiece();
                if (!isValidPosition(currentPiece.cells, currentPiece.row, currentPiece.col)) {
                    endGame();
                }
            }

            function movePiece(dRow, dCol) {
                if (!gameRunning || gamePaused || gameOver) return false;
                if (isValidPosition(currentPiece.cells, currentPiece.row+dRow, currentPiece.col+dCol)) {
                    currentPiece.row += dRow;
                    currentPiece.col += dCol;
                    return true;
                }
                return false;
            }

            function rotateCurrentPiece() {
                if (!gameRunning || gamePaused || gameOver) return;
                const newCells = rotatePiece(currentPiece);
                if (isValidPosition(newCells, currentPiece.row, currentPiece.col)) {
                    currentPiece.cells = newCells; sfxRotate(); return;
                }
                for (const kick of [1,-1,2,-2]) {
                    if (isValidPosition(newCells, currentPiece.row, currentPiece.col+kick)) {
                        currentPiece.cells = newCells; currentPiece.col += kick; sfxRotate(); return;
                    }
                }
            }

            function softDrop() { if (movePiece(1,0)) { sfxMove(); return true; } return false; }
            function hardDrop() {
                if (!gameRunning || gamePaused || gameOver) return;
                while (isValidPosition(currentPiece.cells, currentPiece.row+1, currentPiece.col)) currentPiece.row++;
                sfxDrop(); lockPiece();
            }

            function lockPiece() {
                placePiece();
                const cleared = clearLines();
                if (cleared > 0) {
                    sfxClear(cleared);
                    const oldLevel = level;
                    lines += cleared;
                    score += cleared * 100 * level + (cleared===4 ? 400*level : 0);
                    level = Math.floor(lines/10) + 1;
                    updateDisplay();
                    if (level > oldLevel) { sfxLevelUp(); showSpecialMessage("LEVEL UP! 🚀"); }
                    checkScoreMilestone();
                } else {
                    score += 10;
                    updateDisplay();
                    checkScoreMilestone();
                }
                spawnPiece();
                lastDropTime = performance.now();
                stopLongPress();
            }

            function updateDisplay() {
                // No DOM updates needed; score is drawn on canvas
                dropInterval = Math.max(50, 800 - (level-1)*70);
            }

            function showSpecialMessage(msg) {
                const ov = document.getElementById('bigActionBtn');
                ov.textContent = msg;
                ov.style.display = 'block';
                specialMessageTimer = 120;
                setTimeout(() => {
                    if (specialMessageTimer <= 0) ov.style.display = 'none';
                }, 2000);
            }

            function checkScoreMilestone() {
                for (const m of SCORE_MILESTONES) {
                    if (score >= m && lastMilestoneScore < m) {
                        lastMilestoneScore = m;
                        let msg;
                        do {
                            msg = congratsMessages[Math.floor(Math.random()*congratsMessages.length)];
                        } while (congratsMessages.indexOf(msg) === lastCongratsIndex && congratsMessages.length > 1);
                        lastCongratsIndex = congratsMessages.indexOf(msg);
                        showSpecialMessage(msg);
                        break;
                    }
                }
            }

            function endGame() {
                gameRunning = false; gameOver = true; sfxGameOver();
                document.getElementById('pauseBlur').style.display = 'none';
                document.getElementById('pauseBtn').style.display = 'none';
                document.getElementById('bigActionBtn').style.display = 'block';
                document.getElementById('bigActionBtn').textContent = 'Game Over - Tap to Restart';
                gamePaused = false;
                stopLongPress();
            }

            function startGame() {
                initAudio(); initBoard();
                score = 0; level = 1; lines = 0; lastMilestoneScore = 0;
                particles = [];
                gameRunning = true; gamePaused = false; gameOver = false;
                dropInterval = 800; lastDropTime = performance.now();
                updateDisplay();
                document.getElementById('pauseBlur').style.display = 'none';
                document.getElementById('bigActionBtn').style.display = 'none';
                document.getElementById('pauseBtn').style.display = 'block';
                document.getElementById('pauseBtn').textContent = '⏸';
                nextPiece = randomPiece(); spawnPiece();
                stopLongPress();
                if (animationId === null) animationId = requestAnimationFrame(gameLoop);
            }

            function togglePause() {
                if (!gameRunning || gameOver) return;
                gamePaused = !gamePaused;
                const blur = document.getElementById('pauseBlur');
                const pauseBtn = document.getElementById('pauseBtn');
                if (gamePaused) {
                    pauseBtn.textContent = '▶';
                    blur.style.display = 'block';
                    document.getElementById('bigActionBtn').style.display = 'block';
                    document.getElementById('bigActionBtn').textContent = 'Resume';
                } else {
                    pauseBtn.textContent = '⏸';
                    blur.style.display = 'none';
                    document.getElementById('bigActionBtn').style.display = 'none';
                    lastDropTime = performance.now();
                }
            }

            // ===================== LONG PRESS BY ZONE =====================
            let longPressTimer = null, repeatInterval = null, currentZone = null;
            function stopLongPress() {
                if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
                if (repeatInterval) { clearInterval(repeatInterval); repeatInterval = null; }
                currentZone = null;
            }
            function startLongPress(zone) {
                stopLongPress();
                if (!gameRunning || gamePaused || gameOver) return;
                currentZone = zone;
                longPressTimer = setTimeout(() => {
                    longPressTimer = null;
                    if (!gameRunning || gamePaused || gameOver) return;
                    if (zone === 'middle') {
                        repeatInterval = setInterval(() => { if (!softDrop()) { lockPiece(); stopLongPress(); } }, 50);
                    } else if (zone === 'left') {
                        repeatInterval = setInterval(() => { if (!movePiece(0,-1)) stopLongPress(); else sfxMove(); }, 100);
                    } else if (zone === 'right') {
                        repeatInterval = setInterval(() => { if (!movePiece(0,1)) stopLongPress(); else sfxMove(); }, 100);
                    }
                }, 300);
            }

            // ===================== DRAWING =====================
            function drawCell(ctx, col, row, color) {
                const x = col * CELL_SIZE, y = row * CELL_SIZE, s = CELL_SIZE;
                const grad = ctx.createLinearGradient(x, y, x+s, y+s);
                grad.addColorStop(0, color); grad.addColorStop(1, 'rgba(0,0,0,0.3)');
                ctx.fillStyle = grad;
                ctx.fillRect(x+1, y+1, s-2, s-2);
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(x+1, y+1, s-2, (s-2)*0.35);
                ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth=1;
                ctx.strokeRect(x+1, y+1, s-2, s-2);
            }

            function drawAll() {
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                // Background
                ctx.fillStyle = '#0d0d20'; ctx.fillRect(0,0,canvasWidth,canvasHeight);

                // Board area (grid)
                ctx.save();
                ctx.translate(boardOffsetX, boardOffsetY);
                ctx.strokeStyle='rgba(255,255,255,0.04)'; ctx.lineWidth=0.5;
                for (let r=0; r<=ROWS; r++) {
                    ctx.beginPath(); ctx.moveTo(0, r*CELL_SIZE); ctx.lineTo(boardWidth, r*CELL_SIZE); ctx.stroke();
                }
                for (let c=0; c<=COLS; c++) {
                    ctx.beginPath(); ctx.moveTo(c*CELL_SIZE, 0); ctx.lineTo(c*CELL_SIZE, boardHeight); ctx.stroke();
                }

                // Draw placed blocks (including bottom obstacle)
                for (let r=0; r<ROWS; r++) {
                    for (let c=0; c<COLS; c++) {
                        if (board[r][c] !== null) {
                            drawCell(ctx, c, r, board[r][c]);
                        }
                    }
                }

                // Current piece & ghost
                if (currentPiece && gameRunning && !gameOver && !gamePaused) {
                    let ghostRow = currentPiece.row;
                    while (isValidPosition(currentPiece.cells, ghostRow+1, currentPiece.col)) ghostRow++;
                    if (ghostRow !== currentPiece.row) {
                        for (const [dr,dc] of currentPiece.cells) {
                            const r = ghostRow+dr, c = currentPiece.col+dc;
                            if (r>=0 && r<ROWS && c>=0 && c<COLS) {
                                ctx.fillStyle='rgba(255,255,255,0.1)';
                                ctx.fillRect(c*CELL_SIZE+1, r*CELL_SIZE+1, CELL_SIZE-2, CELL_SIZE-2);
                            }
                        }
                    }
                    for (const [dr,dc] of currentPiece.cells) {
                        const r = currentPiece.row+dr, c = currentPiece.col+dc;
                        if (r>=0 && r<ROWS && c>=0 && c<COLS) drawCell(ctx, c, r, currentPiece.color);
                    }
                }

                // Particles
                particles.forEach(p=>{
                    const alpha = p.life/p.maxLife;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
                });
                ctx.globalAlpha = 1;
                ctx.restore();

                // Draw HUD (score, level, lines, next piece) on canvas
                drawHUD();
            }

            function drawHUD() {
                const nextX = canvasWidth - 70, nextY = 10;
                // Next piece
                if (nextPiece) {
                    const ns = 16;
                    const cells = nextPiece.cells;
                    const minR = Math.min(...cells.map(c=>c[0])), minC = Math.min(...cells.map(c=>c[1]));
                    const maxR = Math.max(...cells.map(c=>c[0])), maxC = Math.max(...cells.map(c=>c[1]));
                    const pw = (maxC-minC+1)*ns, ph = (maxR-minR+1)*ns;
                    const ox = nextX, oy = nextY;
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Poppins'; ctx.textAlign='right';
                    ctx.fillText('NEXT', nextX+40, nextY-5);
                    for (const [dr,dc] of cells) {
                        const x = ox + (dc-minC)*ns, y = oy + (dr-minR)*ns;
                        ctx.fillStyle = nextPiece.color;
                        ctx.fillRect(x, y, ns-1, ns-1);
                        ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(x, y, ns-1, 4);
                    }
                }

                // Score / Level / Lines
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px Fredoka One';
                ctx.textAlign = 'left';
                ctx.fillText(`${score}`, 70, 30);
                ctx.font = '10px Poppins'; ctx.fillText('SCORE', 70, 15);
                ctx.fillText(`${level}`, 160, 30);
                ctx.fillText('LEVEL', 160, 15);
                ctx.fillText(`${lines}`, 250, 30);
                ctx.fillText('LINES', 250, 15);
            }

            // ===================== GAME LOOP =====================
            function gameLoop(timestamp) {
                animationId = requestAnimationFrame(gameLoop);
                if (gameRunning && !gamePaused && !gameOver) {
                    if (timestamp - lastDropTime > dropInterval) {
                        if (!movePiece(1,0)) { lockPiece(); } else { lastDropTime = timestamp; }
                    }
                    updateParticles();
                }
                if (specialMessageTimer > 0) {
                    specialMessageTimer--;
                    if (specialMessageTimer <= 0) {
                        document.getElementById('bigActionBtn').style.display = 'none';
                    }
                }
                drawAll();
            }

            // ===================== CONTROLS =====================
            document.addEventListener('keydown', (e)=>{
                if (e.code==='Space'||e.code==='ArrowUp') { e.preventDefault(); rotateCurrentPiece(); }
                else if (e.code==='ArrowDown') { e.preventDefault(); if (movePiece(1,0)) sfxMove(); }
                else if (e.code==='ArrowLeft') { e.preventDefault(); if (movePiece(0,-1)) sfxMove(); }
                else if (e.code==='ArrowRight') { e.preventDefault(); if (movePiece(0,1)) sfxMove(); }
                else if (e.code==='KeyD'||e.code==='KeyS') { e.preventDefault(); hardDrop(); }
                else if (e.code==='Escape'||e.code==='KeyP') { e.preventDefault(); togglePause(); }
            });

            // Mobile touch
            let touchStartX=0, touchStartY=0, touchStartTime=0, touchMoved=false;
            gameCanvas.addEventListener('touchstart', (e)=>{
                e.preventDefault(); initAudio();
                if (e.touches.length===1) {
                    touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY;
                    touchStartTime=Date.now(); touchMoved=false;
                    if (gameRunning && !gamePaused && !gameOver) {
                        const rect = gameCanvas.getBoundingClientRect();
                        const relX = touchStartX - rect.left;
                        const leftZone = 0.25 * rect.width, rightZone = 0.75 * rect.width;
                        if (relX < leftZone) startLongPress('left');
                        else if (relX > rightZone) startLongPress('right');
                        else startLongPress('middle');
                    }
                }
            }, {passive:false});
            gameCanvas.addEventListener('touchmove', (e)=>{
                e.preventDefault();
                if (!gameRunning || gamePaused || gameOver) return;
                if (Math.abs(e.touches[0].clientX-touchStartX)>10 || Math.abs(e.touches[0].clientY-touchStartY)>10) {
                    touchMoved=true; stopLongPress();
                }
            }, {passive:false});
            gameCanvas.addEventListener('touchend', (e)=>{
                e.preventDefault(); stopLongPress();
                if (!gameRunning || gamePaused || gameOver) return;
                const dx = (e.changedTouches[0]?.clientX||touchStartX)-touchStartX;
                const dy = (e.changedTouches[0]?.clientY||touchStartY)-touchStartY;
                const dt = Date.now()-touchStartTime;
                const absDx=Math.abs(dx), absDy=Math.abs(dy);
                if (dt<300 && absDx<20 && absDy<20 && !touchMoved) {
                    const rect = gameCanvas.getBoundingClientRect();
                    const tapX = e.changedTouches[0].clientX - rect.left;
                    if (tapX < 0.25*rect.width) { if (movePiece(0,-1)) sfxMove(); }
                    else if (tapX > 0.75*rect.width) { if (movePiece(0,1)) sfxMove(); }
                    else rotateCurrentPiece();
                    return;
                }
                if (absDy>absDx && absDy>30) { if (dy>0) hardDrop(); else rotateCurrentPiece(); }
                else if (absDx>absDy && absDx>30) { if (dx<0 && movePiece(0,-1)) sfxMove(); else if (dx>0 && movePiece(0,1)) sfxMove(); }
            }, {passive:false});

            // Overlay buttons
            document.getElementById('softDropBtn').addEventListener('click', ()=>{ initAudio(); softDrop(); });
            document.getElementById('hardDropBtn').addEventListener('click', ()=>{ initAudio(); hardDrop(); });
            document.getElementById('pauseBtn').addEventListener('click', togglePause);
            document.getElementById('bigActionBtn').addEventListener('click', ()=>{
                if (!gameRunning || gameOver) startGame();
                else if (gamePaused) togglePause();
            });

            // ===================== INIT =====================
            function initGame() {
                resizeCanvas();
                initBoard();
                nextPiece = randomPiece();
                drawAll();
                document.getElementById('pauseBtn').style.display = 'none';
                document.getElementById('bigActionBtn').style.display = 'block';
                document.getElementById('bigActionBtn').textContent = 'Start';
                gameRunning = false; gameOver = false; gamePaused = false;
                stopLongPress();
            }
            initGame();
            animationId = requestAnimationFrame(gameLoop);
        })();
    </script>
</body>
</html>

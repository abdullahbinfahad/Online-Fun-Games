<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a14">
    <title>Tetris • ABDULLAH BIN FAHAD</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a14;
            --neon-cyan: #00e5ff;
            --neon-green: #39ff14;
            --text: #e0e0e0;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            width:100%; height:100%; overflow:hidden; position:fixed; top:0; left:0; right:0; bottom:0;
            background:var(--bg); font-family:'Poppins',sans-serif; touch-action:manipulation;
            -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
            -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
        }
        .game-wrapper {
            display:flex; flex-direction:row; align-items:center; justify-content:center;
            width:100%; height:100%; padding:clamp(8px,2vw,20px); gap:clamp(12px,2vw,30px);
        }
        .board-container {
            position:relative; display:flex; align-items:center; justify-content:center; flex-shrink:0;
        }
        canvas#gameCanvas {
            display:block; border:2px solid rgba(255,255,255,0.2); border-radius:8px;
            box-shadow:0 0 30px rgba(100,100,255,0.3); background:#0d0d20;
        }

        /* Blur overlay for pause */
        .pause-blur {
            position:absolute; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.55); backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
            z-index:12; display:none; pointer-events:none;
            border-radius: 8px;
        }

        /* Desktop side panel (unchanged) */
        .info-panel {
            display:flex; flex-direction:column; gap:clamp(8px,1.5vw,16px);
            background:#111122; border-radius:12px; padding:clamp(10px,2vw,20px);
            border:1px solid rgba(255,255,255,0.15); box-shadow:0 0 20px rgba(0,0,0,0.5);
            min-width:clamp(100px,15vw,180px); justify-content:center; color:var(--text); flex-shrink:0;
        }
        .info-panel h2 {
            font-size:clamp(14px,2.5vw,22px); text-align:center; color:var(--neon-cyan);
            text-shadow:0 0 10px rgba(0,229,255,0.6); letter-spacing:2px; font-weight:700;
        }
        .info-panel .info-item { display:flex; flex-direction:column; align-items:center; gap:2px; }
        .info-panel .info-label { font-size:clamp(8px,1.3vw,11px); text-transform:uppercase; letter-spacing:2px; color:rgba(255,255,255,0.5); font-weight:600; }
        .info-panel .info-value { font-size:clamp(18px,3.5vw,30px); font-weight:700; color:#fff; text-shadow:0 0 12px rgba(255,215,0,0.5); font-family:'Fredoka One',cursive; }
        .info-panel .next-piece { display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.3); border-radius:8px; padding:8px; min-height:clamp(40px,8vw,70px); }
        .info-panel .btn {
            padding:clamp(8px,1.5vw,12px) clamp(12px,2vw,20px); border:none; border-radius:8px; cursor:pointer;
            font-weight:700; font-size:clamp(11px,1.6vw,15px); letter-spacing:1px; text-transform:uppercase;
            transition:all 0.2s; background:var(--neon-green); color:#000; box-shadow:0 0 15px rgba(57,255,20,0.4);
        }
        .info-panel .btn-pause { background:var(--neon-cyan); box-shadow:0 0 15px rgba(0,229,255,0.4); }

        /* Mobile only overlays */
        .mobile-overlay {
            display:none; position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10;
        }
        .mobile-stats {
            position:absolute; top:6px; left:6px; display:flex; gap:12px; align-items:center;
            background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.15); border-radius:10px;
            padding:4px 10px; pointer-events:none; color:#fff;
        }
        .mobile-stats .stat-item { display:flex; flex-direction:column; align-items:center; min-width:36px; }
        .mobile-stats .stat-label { font-size:7px; text-transform:uppercase; letter-spacing:1px; color:rgba(255,255,255,0.5); font-weight:600; }
        .mobile-stats .stat-value { font-family:'Fredoka One',cursive; font-size:clamp(12px,3vw,18px); text-shadow:0 0 6px rgba(255,215,0,0.4); }
        .mobile-next {
            position:absolute; top:6px; right:6px; background:rgba(0,0,0,0.55);
            border:1px solid rgba(255,255,255,0.15); border-radius:10px; padding:4px; pointer-events:none;
        }
        .mobile-next canvas { display:block; }

        /* Pause button (small, top bar) */
        .mobile-pause-btn {
            position:absolute; top:6px; right:80px; padding:4px 10px; font-size:10px; border:none; border-radius:6px;
            font-weight:700; cursor:pointer; background:var(--neon-cyan); color:#000; box-shadow:0 0 8px rgba(0,229,255,0.4);
            text-transform:uppercase; pointer-events:auto; display:none;
        }

        /* Big centered action button */
        .big-action-btn {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            padding:16px 32px; font-size:clamp(18px,4vw,28px); font-weight:700; letter-spacing:2px;
            border:none; border-radius:16px; cursor:pointer; background:var(--neon-green); color:#000;
            box-shadow:0 0 25px rgba(57,255,20,0.6); text-transform:uppercase;
            pointer-events:auto; z-index:15; font-family:'Fredoka One',cursive;
            transition:all 0.2s; display:none;
        }
        .big-action-btn:active { transform:translate(-50%,-50%) scale(0.95); }

        /* Soft & hard drop buttons under stats / next */
        .action-btns-row {
            position:absolute; top:60px; left:0; right:0; display:flex; justify-content:space-between;
            padding:0 10px; pointer-events:none;
        }
        .action-btn {
            width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.15);
            border:2px solid rgba(255,255,255,0.35); color:#fff; font-size:20px;
            display:flex; align-items:center; justify-content:center; cursor:pointer; pointer-events:auto;
            transition:all 0.15s; -webkit-tap-highlight-color:transparent; user-select:none;
        }
        .action-btn:active { background:rgba(255,255,255,0.35); transform:scale(0.9); border-color:var(--neon-cyan); box-shadow:0 0 15px rgba(0,229,255,0.5); }
        .soft-btn::after { content:'↓'; font-size:24px; }
        .hard-btn::after { content:'🔥↓'; font-size:20px; }

        /* Overlay messages */
        .special-overlay {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0); z-index:40; pointer-events:none;
            background:linear-gradient(135deg, rgba(255,45,120,0.95), rgba(255,107,53,0.95));
            color:#fff; padding:14px 26px; border-radius:30px; font-weight:700; font-size:clamp(14px,2.5vw,20px);
            text-align:center; box-shadow:0 8px 30px rgba(255,45,120,0.6); border:2px solid rgba(255,255,255,0.3);
            transition:transform 0.5s cubic-bezier(0.175,0.885,0.32,1.275); white-space:nowrap; letter-spacing:0.5px; max-width:90vw;
        }
        .special-overlay.show { transform:translate(-50%,-50%) scale(1); animation:bounceIn 0.6s cubic-bezier(0.175,0.885,0.32,1.275); }
        @keyframes bounceIn {
            0% { transform:translate(-50%,-50%) scale(0); }
            50% { transform:translate(-50%,-50%) scale(1.2); }
            70% { transform:translate(-50%,-50%) scale(0.9); }
            100% { transform:translate(-50%,-50%) scale(1); }
        }
        .gameover-overlay {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:45; pointer-events:auto;
            background:rgba(0,0,0,0.85); border:2px solid rgba(255,255,255,0.3); border-radius:16px;
            padding:20px 30px; text-align:center; color:#fff; display:none; box-shadow:0 0 40px rgba(255,0,0,0.3);
        }
        .gameover-overlay h2 { color:#ff3b5c; font-size:clamp(24px,4vw,36px); margin-bottom:10px; font-family:'Fredoka One',cursive; }
        .gameover-overlay p { font-size:clamp(12px,2vw,18px); margin:4px 0; }
        .gameover-overlay .btn { margin-top:12px; padding:10px 20px; background:var(--neon-green); color:#000; border:none; border-radius:8px; font-weight:700; cursor:pointer; }

        @media (max-width:768px) {
            .game-wrapper { padding:0; gap:0; }
            .info-panel { display:none; }
            .board-container { width:100vw; height:100vh; position:fixed; top:0; left:0; }
            canvas#gameCanvas { border:none; border-radius:0; width:100%; height:100%; }
            .mobile-overlay { display:block; }
            .mobile-pause-btn { display:none; } /* shown by JS */
            .pause-blur { border-radius:0; }
        }
    </style>
</head>
<body>
    <div class="special-overlay" id="specialMessage"></div>
    <div class="gameover-overlay" id="gameoverOverlay">
        <h2>GAME OVER</h2>
        <p>Score: <span id="goScore">0</span></p>
        <p>Level: <span id="goLevel">1</span></p>
        <p>Lines: <span id="goLines">0</span></p>
        <button class="btn" id="btnRestart">Play Again</button>
    </div>

    <div class="game-wrapper">
        <div class="board-container" id="boardContainer">
            <canvas id="gameCanvas"></canvas>
            <div class="pause-blur" id="pauseBlur"></div>
            <div class="mobile-overlay" id="mobileOverlay">
                <div class="mobile-stats">
                    <div class="stat-item"><span class="stat-label">Score</span><span class="stat-value" id="scoreMobile">0</span></div>
                    <div class="stat-item"><span class="stat-label">Level</span><span class="stat-value" id="levelMobile">1</span></div>
                    <div class="stat-item"><span class="stat-label">Lines</span><span class="stat-value" id="linesMobile">0</span></div>
                </div>
                <div class="mobile-next"><canvas id="nextCanvasMobile" width="60" height="40"></canvas></div>
                <button class="mobile-pause-btn" id="mobilePauseBtn">Pause</button>
                <button class="big-action-btn" id="bigActionBtn">Start</button>
                <!-- New action buttons row under stats/next -->
                <div class="action-btns-row">
                    <div class="action-btn soft-btn" id="softDropBtn" title="Soft drop"></div>
                    <div class="action-btn hard-btn" id="hardDropBtn" title="Hard drop"></div>
                </div>
            </div>
        </div>

        <!-- Desktop side panel -->
        <div class="info-panel" id="infoPanel">
            <h2>TETRIS</h2>
            <div class="info-item"><span class="info-label">Score</span><span class="info-value" id="scoreDisplay">0</span></div>
            <div class="info-item"><span class="info-label">Level</span><span class="info-value" id="levelDisplay">1</span></div>
            <div class="info-item"><span class="info-label">Lines</span><span class="info-value" id="linesDisplay">0</span></div>
            <div class="next-piece"><canvas id="nextCanvas" width="100" height="80"></canvas></div>
            <button class="btn" id="btnStart">Start</button>
            <button class="btn btn-pause" id="btnPause" style="display:none;">Pause</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===================== AUDIO =====================
            let audioCtx;
            function initAudio() { if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)(); }
            function playBeep(freq, dur, type = 'square', vol = 0.08) {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + dur);
                } catch (e) {}
            }
            function sfxMove() { playBeep(300, 0.05, 'sine', 0.05); }
            function sfxRotate() { playBeep(500, 0.06, 'sine', 0.06); }
            function sfxDrop() { playBeep(150, 0.1, 'triangle', 0.1); }
            function sfxClear(n) { for (let i=0;i<n;i++) setTimeout(()=>playBeep(600+i*150,0.12,'square',0.1), i*80); }
            function sfxLevelUp() { playBeep(800,0.1,'triangle',0.12); setTimeout(()=>playBeep(1000,0.1,'triangle',0.12),100); }
            function sfxGameOver() { playBeep(200,0.3,'sawtooth',0.2); playBeep(150,0.4,'sawtooth',0.18); }

            // ===================== CANVAS & RESPONSIVE =====================
            const gameCanvas = document.getElementById('gameCanvas');
            const gameCtx = gameCanvas.getContext('2d');
            const nextCanvas = document.getElementById('nextCanvas');
            const nextCtx = nextCanvas.getContext('2d');
            const nextCanvasMobile = document.getElementById('nextCanvasMobile');
            const nextCtxMobile = nextCanvasMobile.getContext('2d');

            const COLS = 10, ROWS = 20;
            let CELL_SIZE, boardWidth, boardHeight;
            let boardOffsetX = 0, boardOffsetY = 0;

            function calcCellSize() {
                const isMobile = window.innerWidth < 769;
                if (isMobile) {
                    const maxW = window.innerWidth;
                    const maxH = window.innerHeight;
                    const fromH = Math.floor(maxH / ROWS);
                    const fromW = Math.floor(maxW / COLS);
                    CELL_SIZE = Math.min(fromH, fromW);
                    boardWidth = CELL_SIZE * COLS;
                    boardHeight = CELL_SIZE * ROWS;
                    gameCanvas.width = maxW;
                    gameCanvas.height = maxH;
                    gameCanvas.style.width = maxW + 'px';
                    gameCanvas.style.height = maxH + 'px';
                    boardOffsetX = (maxW - boardWidth) / 2;
                    boardOffsetY = (maxH - boardHeight) / 2;
                } else {
                    const maxH = window.innerHeight * 0.85;
                    const maxW = window.innerWidth * 0.55;
                    const fromH = Math.floor(maxH / ROWS);
                    const fromW = Math.floor(maxW / COLS);
                    CELL_SIZE = Math.max(20, Math.min(38, Math.min(fromH, fromW)));
                    boardWidth = CELL_SIZE * COLS;
                    boardHeight = CELL_SIZE * ROWS;
                    gameCanvas.width = boardWidth;
                    gameCanvas.height = boardHeight;
                    gameCanvas.style.width = boardWidth + 'px';
                    gameCanvas.style.height = boardHeight + 'px';
                    boardOffsetX = 0;
                    boardOffsetY = 0;
                }
            }
            calcCellSize();
            window.addEventListener('resize', () => { calcCellSize(); drawBoard(); });
            window.addEventListener('orientationchange', () => setTimeout(calcCellSize, 200));

            // ===================== GAME STATE =====================
            const SHAPES = [
                { name:'I', cells:[[0,0],[0,1],[0,2],[0,3]], color:'#00e5ff' },
                { name:'O', cells:[[0,0],[0,1],[1,0],[1,1]], color:'#ffd700' },
                { name:'T', cells:[[0,0],[0,1],[0,2],[1,1]], color:'#b44dff' },
                { name:'S', cells:[[0,1],[0,2],[1,0],[1,1]], color:'#39ff14' },
                { name:'Z', cells:[[0,0],[0,1],[1,1],[1,2]], color:'#ff2d78' },
                { name:'J', cells:[[0,0],[1,0],[1,1],[1,2]], color:'#0077ff' },
                { name:'L', cells:[[0,2],[1,0],[1,1],[1,2]], color:'#ff8c00' },
            ];

            let board, currentPiece, nextPiece;
            let score=0, level=1, lines=0;
            let gameRunning=false, gamePaused=false, gameOver=false;
            let dropInterval=800, lastDropTime=0;
            let animationId=null, particles=[];
            let specialMessageTimer=0, lastMilestoneScore=0;
            const SCORE_MILESTONES = [1000,5000,10000,20000,30000,40000,50000,75000,100000];
            const congratsMessages = [
                "ABDULLAH BIN FAHAD THINKS YOU'RE GREAT! 🌟",
                "ABDULLAH BIN FAHAD SAYS YOU'RE A GENIUS! 🧠",
                "ABDULLAH BIN FAHAD THINKS YOU'RE AMAZING! 💫",
                "ABDULLAH BIN FAHAD CALLS YOU A LEGEND! 👑",
                "ABDULLAH BIN FAHAD SAYS YOU'RE UNSTOPPABLE! 🔥",
                "ABDULLAH BIN FAHAD THINKS YOU'RE INCREDIBLE! ⚡",
                "ABDULLAH BIN FAHAD SAYS YOU'RE A MASTER! 🏆",
                "ABDULLAH BIN FAHAD THINKS YOU'RE PHENOMENAL! 🌈",
                "ABDULLAH BIN FAHAD SAYS YOU'RE THE BEST! 💎",
                "ABDULLAH BIN FAHAD THINKS YOU'RE A PRODIGY! 🎯",
            ];
            let lastCongratsIndex=-1;

            function initBoard() { board = Array.from({length:ROWS}, ()=>Array(COLS).fill(null)); }
            function randomPiece() {
                const s = SHAPES[Math.floor(Math.random()*SHAPES.length)];
                return { cells:s.cells.map(c=>[c[0],c[1]]), color:s.color, name:s.name, row:0, col:Math.floor(COLS/2)-1 };
            }
            function rotatePiece(piece) {
                if (piece.name==='O') return piece.cells.map(c=>[c[0],c[1]]);
                const newCells = piece.cells.map(c=>[c[1],-c[0]]);
                const minR = Math.min(...newCells.map(c=>c[0]));
                const minC = Math.min(...newCells.map(c=>c[1]));
                return newCells.map(c=>[c[0]-minR, c[1]-minC]);
            }
            function isValidPosition(cells, row, col) {
                for (const [dr,dc] of cells) {
                    const r=row+dr, c=col+dc;
                    if (r<0||r>=ROWS||c<0||c>=COLS||board[r][c]!==null) return false;
                }
                return true;
            }
            function placePiece() {
                for (const [dr,dc] of currentPiece.cells) {
                    const r=currentPiece.row+dr, c=currentPiece.col+dc;
                    if (r>=0&&r<ROWS&&c>=0&&c<COLS) board[r][c]=currentPiece.color;
                }
            }
            function clearLines() {
                let cleared=0;
                for (let r=ROWS-1;r>=0;r--) {
                    if (board[r].every(cell=>cell!==null)) {
                        for (let c=0;c<COLS;c++) spawnParticles(c*CELL_SIZE+CELL_SIZE/2, r*CELL_SIZE+CELL_SIZE/2, board[r][c]);
                        board.splice(r,1);
                        board.unshift(Array(COLS).fill(null));
                        cleared++; r++;
                    }
                }
                return cleared;
            }
            function spawnParticles(x,y,color) {
                for (let i=0;i<6;i++) particles.push({x,y, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6-3, life:30+Math.random()*20, maxLife:50, color, r:2+Math.random()*3});
            }
            function updateParticles() {
                for (let i=particles.length-1;i>=0;i--) {
                    const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life--;
                    if (p.life<=0) particles.splice(i,1);
                }
            }
            function spawnPiece() {
                if (nextPiece===null) nextPiece=randomPiece();
                currentPiece=nextPiece;
                currentPiece.row=0; currentPiece.col=Math.floor(COLS/2)-1;
                nextPiece=randomPiece();
                if (!isValidPosition(currentPiece.cells, currentPiece.row, currentPiece.col)) endGame();
            }
            function movePiece(dRow,dCol) {
                if (!gameRunning||gamePaused||gameOver) return false;
                if (isValidPosition(currentPiece.cells, currentPiece.row+dRow, currentPiece.col+dCol)) {
                    currentPiece.row+=dRow; currentPiece.col+=dCol; return true;
                }
                return false;
            }
            function rotateCurrentPiece() {
                if (!gameRunning||gamePaused||gameOver) return;
                const newCells = rotatePiece(currentPiece);
                if (isValidPosition(newCells, currentPiece.row, currentPiece.col)) { currentPiece.cells=newCells;
                    sfxRotate(); return; }
                for (const kick of [1,-1,2,-2]) {
                    if (isValidPosition(newCells, currentPiece.row, currentPiece.col+kick)) {
                        currentPiece.cells=newCells; currentPiece.col+=kick; sfxRotate(); return;
                    }
                }
            }
            function softDrop() {
                if (movePiece(1,0)) { sfxMove(); return true; }
                return false;
            }
            function hardDrop() {
                if (!gameRunning||gamePaused||gameOver) return;
                while (isValidPosition(currentPiece.cells, currentPiece.row+1, currentPiece.col)) currentPiece.row++;
                sfxDrop(); lockPiece();
            }
            function lockPiece() {
                placePiece();
                const cleared=clearLines();
                if (cleared>0) {
                    sfxClear(cleared);
                    const oldLevel=level;
                    lines+=cleared; score += cleared*100*level + (cleared===4?400*level:0);
                    level = Math.floor(lines/10)+1;
                    updateAllDisplays();
                    if (level>oldLevel) { sfxLevelUp(); showSpecialMessage("LEVEL UP! 🚀"); }
                    checkScoreMilestone();
                } else {
                    score+=10; updateAllDisplays(); checkScoreMilestone();
                }
                spawnPiece(); lastDropTime=performance.now();
                stopLongPress();
            }
            function updateAllDisplays() {
                document.getElementById('scoreDisplay').textContent=score;
                document.getElementById('levelDisplay').textContent=level;
                document.getElementById('linesDisplay').textContent=lines;
                document.getElementById('scoreMobile').textContent=score;
                document.getElementById('levelMobile').textContent=level;
                document.getElementById('linesMobile').textContent=lines;
                dropInterval = Math.max(50, 800 - (level-1)*70);
            }
            function showSpecialMessage(msg) {
                const ov = document.getElementById('specialMessage');
                ov.textContent=msg; ov.classList.remove('show'); void ov.offsetWidth; ov.classList.add('show');
                specialMessageTimer=120;
            }
            function checkScoreMilestone() {
                for (const m of SCORE_MILESTONES) {
                    if (score>=m && lastMilestoneScore<m) {
                        lastMilestoneScore=m;
                        let msg;
                        do { msg=congratsMessages[Math.floor(Math.random()*congratsMessages.length)]; }
                        while (congratsMessages.indexOf(msg)===lastCongratsIndex && congratsMessages.length>1);
                        lastCongratsIndex=congratsMessages.indexOf(msg);
                        showSpecialMessage(msg);
                        break;
                    }
                }
            }
            function endGame() {
                gameRunning=false; gameOver=true; sfxGameOver();
                document.getElementById('goScore').textContent=score;
                document.getElementById('goLevel').textContent=level;
                document.getElementById('goLines').textContent=lines;
                document.getElementById('gameoverOverlay').style.display='block';
                document.getElementById('btnStart').style.display='block';
                document.getElementById('btnPause').style.display='none';
                document.getElementById('bigActionBtn').style.display='none';
                document.getElementById('mobilePauseBtn').style.display='none';
                document.getElementById('pauseBlur').style.display='none';
            }
            function startGame() {
                initAudio(); initBoard();
                score=0; level=1; lines=0; lastMilestoneScore=0;
                particles=[]; gameRunning=true; gamePaused=false; gameOver=false;
                dropInterval=800; lastDropTime=performance.now();
                updateAllDisplays();
                document.getElementById('gameoverOverlay').style.display='none';
                document.getElementById('btnStart').style.display='none';
                document.getElementById('btnPause').style.display='block';
                document.getElementById('bigActionBtn').style.display='none';
                document.getElementById('mobilePauseBtn').style.display='block';
                document.getElementById('mobilePauseBtn').textContent = 'Pause';
                document.getElementById('pauseBlur').style.display='none';
                document.getElementById('specialMessage').classList.remove('show');
                specialMessageTimer=0;
                nextPiece=randomPiece(); spawnPiece();
                stopLongPress();
                if (animationId===null) animationId=requestAnimationFrame(gameLoop);
            }
            function togglePause() {
                if (!gameRunning||gameOver) return;
                gamePaused = !gamePaused;
                const blur = document.getElementById('pauseBlur');
                const bigBtn = document.getElementById('bigActionBtn');
                if (gamePaused) {
                    document.getElementById('btnPause').textContent='Resume';
                    document.getElementById('mobilePauseBtn').textContent='Resume';
                    bigBtn.style.display='block';
                    bigBtn.textContent='Resume';
                    blur.style.display='block';
                } else {
                    document.getElementById('btnPause').textContent='Pause';
                    document.getElementById('mobilePauseBtn').textContent='Pause';
                    bigBtn.style.display='none';
                    blur.style.display='none';
                    lastDropTime = performance.now();
                }
            }

            // ===================== LONG PRESS SOFT DROP =====================
            let longPressTimer = null;
            let softDropInterval = null;
            function startLongPress() {
                if (longPressTimer) return;
                longPressTimer = setTimeout(() => {
                    longPressTimer = null;
                    if (!gameRunning || gamePaused || gameOver) return;
                    softDropInterval = setInterval(() => {
                        if (!softDrop()) {
                            lockPiece();
                            stopLongPress();
                        }
                    }, 50);
                }, 300);
            }
            function stopLongPress() {
                if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
                if (softDropInterval) { clearInterval(softDropInterval); softDropInterval = null; }
            }

            // ===================== DRAWING =====================
            function drawCell(ctx,col,row,color) {
                const x=col*CELL_SIZE, y=row*CELL_SIZE, s=CELL_SIZE;
                const grad=ctx.createLinearGradient(x,y,x+s,y+s);
                grad.addColorStop(0,color); grad.addColorStop(1,'rgba(0,0,0,0.3)');
                ctx.fillStyle=grad; ctx.fillRect(x+1,y+1,s-2,s-2);
                ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect(x+1,y+1,s-2,(s-2)*0.35);
                ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect(x+1,y+1,(s-2)*0.35,s-2);
                ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=1; ctx.strokeRect(x+1,y+1,s-2,s-2);
            }
            function drawBoard() {
                const canvasW = gameCanvas.width;
                const canvasH = gameCanvas.height;
                gameCtx.clearRect(0,0,canvasW,canvasH);
                gameCtx.save();
                gameCtx.translate(boardOffsetX, boardOffsetY);
                gameCtx.strokeStyle='rgba(255,255,255,0.04)'; gameCtx.lineWidth=0.5;
                for (let r=0; r<=ROWS; r++) {
                    gameCtx.beginPath();
                    gameCtx.moveTo(0, r*CELL_SIZE);
                    gameCtx.lineTo(boardWidth, r*CELL_SIZE);
                    gameCtx.stroke();
                }
                for (let c=0; c<=COLS; c++) {
                    gameCtx.beginPath();
                    gameCtx.moveTo(c*CELL_SIZE, 0);
                    gameCtx.lineTo(c*CELL_SIZE, boardHeight);
                    gameCtx.stroke();
                }
                for (let r=0; r<ROWS; r++) for (let c=0; c<COLS; c++) if (board[r][c]!==null) drawCell(gameCtx,c,r,board[r][c]);
                if (currentPiece && gameRunning && !gameOver) {
                    let ghostRow=currentPiece.row;
                    while (isValidPosition(currentPiece.cells, ghostRow+1, currentPiece.col)) ghostRow++;
                    if (ghostRow!==currentPiece.row) {
                        for (const [dr,dc] of currentPiece.cells) {
                            const r=ghostRow+dr, c=currentPiece.col+dc;
                            if (r>=0&&r<ROWS&&c>=0&&c<COLS) {
                                gameCtx.fillStyle='rgba(255,255,255,0.1)';
                                gameCtx.fillRect(c*CELL_SIZE+1,r*CELL_SIZE+1,CELL_SIZE-2,CELL_SIZE-2);
                                gameCtx.strokeStyle='rgba(255,255,255,0.3)'; gameCtx.strokeRect(c*CELL_SIZE+1,r*CELL_SIZE+1,CELL_SIZE-2,CELL_SIZE-2);
                            }
                        }
                    }
                    for (const [dr,dc] of currentPiece.cells) {
                        const r=currentPiece.row+dr, c=currentPiece.col+dc;
                        if (r>=0&&r<ROWS&&c>=0&&c<COLS) drawCell(gameCtx,c,r,currentPiece.color);
                    }
                }
                particles.forEach(p=>{
                    const alpha = p.life/p.maxLife;
                    gameCtx.fillStyle = p.color.replace(')',`, ${alpha})`).replace('rgb','rgba');
                    if (p.color.startsWith('#')) {
                        const rr=parseInt(p.color.slice(1,3),16), gg=parseInt(p.color.slice(3,5),16), bb=parseInt(p.color.slice(5,7),16);
                        gameCtx.fillStyle=`rgba(${rr},${gg},${bb},${alpha})`;
                    }
                    gameCtx.beginPath();
                    gameCtx.arc(p.x, p.y, p.r*(0.5+alpha*0.5),0,Math.PI*2);
                    gameCtx.fill();
                });
                // Removed PAUSED text – blur overlay handles it
                gameCtx.restore();
            }
            function drawNextPiece(ctx, canvasW, canvasH) {
                ctx.clearRect(0,0,canvasW,canvasH);
                if (!nextPiece) return;
                const ns=Math.min(18, Math.floor(canvasW/6));
                const minR=Math.min(...nextPiece.cells.map(c=>c[0])), minC=Math.min(...nextPiece.cells.map(c=>c[1]));
                const maxR=Math.max(...nextPiece.cells.map(c=>c[0])), maxC=Math.max(...nextPiece.cells.map(c=>c[1]));
                const pw=(maxC-minC+1)*ns, ph=(maxR-minR+1)*ns;
                const ox=(canvasW-pw)/2, oy=(canvasH-ph)/2;
                for (const [dr,dc] of nextPiece.cells) {
                    const x=ox+(dc-minC)*ns, y=oy+(dr-minR)*ns;
                    const grad=ctx.createLinearGradient(x,y,x+ns,y+ns);
                    grad.addColorStop(0,nextPiece.color); grad.addColorStop(1,'rgba(0,0,0,0.3)');
                    ctx.fillStyle=grad; ctx.fillRect(x+1,y+1,ns-2,ns-2);
                    ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect(x+1,y+1,ns-2,(ns-2)*0.3);
                    ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1; ctx.strokeRect(x+1,y+1,ns-2,ns-2);
                }
            }
            function drawAllNext() {
                drawNextPiece(nextCtx, nextCanvas.width, nextCanvas.height);
                drawNextPiece(nextCtxMobile, nextCanvasMobile.width, nextCanvasMobile.height);
            }

            // ===================== GAME LOOP =====================
            function gameLoop(timestamp) {
                animationId=requestAnimationFrame(gameLoop);
                if (gameRunning && !gamePaused && !gameOver) {
                    if (timestamp - lastDropTime > dropInterval) {
                        if (!movePiece(1,0)) { lockPiece(); } else { lastDropTime=timestamp; }
                    }
                    updateParticles();
                }
                if (specialMessageTimer>0) { specialMessageTimer--; if (specialMessageTimer<=0) document.getElementById('specialMessage').classList.remove('show'); }
                drawBoard(); drawAllNext();
            }

            // ===================== CONTROLS =====================
            document.addEventListener('keydown', (e)=>{
                if (e.code==='Space'||e.code==='ArrowUp') { e.preventDefault(); rotateCurrentPiece(); }
                else if (e.code==='ArrowDown') { e.preventDefault(); if (movePiece(1,0)) sfxMove(); }
                else if (e.code==='ArrowLeft') { e.preventDefault(); if (movePiece(0,-1)) sfxMove(); }
                else if (e.code==='ArrowRight') { e.preventDefault(); if (movePiece(0,1)) sfxMove(); }
                else if (e.code==='KeyD'||e.code==='KeyS') { e.preventDefault(); hardDrop(); }
                else if (e.code==='Escape'||e.code==='KeyP') { e.preventDefault(); togglePause(); }
            });

            // Mobile touch handling
            let touchStartX=0, touchStartY=0, touchStartTime=0;
            let touchMoved = false;

            gameCanvas.addEventListener('touchstart', (e)=>{
                e.preventDefault();
                initAudio();
                if (e.touches.length===1) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    touchStartTime = Date.now();
                    touchMoved = false;
                    if (gameRunning && !gamePaused && !gameOver) {
                        startLongPress();
                    }
                }
            }, {passive:false});

            gameCanvas.addEventListener('touchmove', (e)=>{
                e.preventDefault();
                if (!gameRunning || gamePaused || gameOver) return;
                const x = e.touches[0].clientX;
                const y = e.touches[0].clientY;
                if (Math.abs(x - touchStartX) > 10 || Math.abs(y - touchStartY) > 10) {
                    touchMoved = true;
                    stopLongPress();
                }
            }, {passive:false});

            gameCanvas.addEventListener('touchend', (e)=>{
                e.preventDefault();
                stopLongPress();
                if (!gameRunning || gamePaused || gameOver) return;
                const touch = e.changedTouches[0];
                const dx = touch.clientX - touchStartX;
                const dy = touch.clientY - touchStartY;
                const dt = Date.now() - touchStartTime;
                const absDx = Math.abs(dx);
                const absDy = Math.abs(dy);

                if (dt < 300 && absDx < 20 && absDy < 20 && !touchMoved) {
                    const canvasRect = gameCanvas.getBoundingClientRect();
                    const tapX = touch.clientX - canvasRect.left;
                    const leftZoneEnd = 0.25 * canvasRect.width;
                    const rightZoneStart = 0.75 * canvasRect.width;
                    if (tapX < leftZoneEnd) {
                        if (movePiece(0, -1)) sfxMove();
                    } else if (tapX > rightZoneStart) {
                        if (movePiece(0, 1)) sfxMove();
                    } else {
                        rotateCurrentPiece();
                    }
                    return;
                }

                if (absDy > absDx && absDy > 30) {
                    if (dy > 0) hardDrop();
                    else rotateCurrentPiece();
                } else if (absDx > absDy && absDx > 30) {
                    if (dx < 0 && movePiece(0, -1)) sfxMove();
                    else if (dx > 0 && movePiece(0, 1)) sfxMove();
                }
            }, {passive:false});

            // Action buttons (soft/hard drop)
            document.getElementById('softDropBtn').addEventListener('touchstart', (e)=>{ e.preventDefault(); e.stopPropagation(); initAudio(); softDrop(); });
            document.getElementById('hardDropBtn').addEventListener('touchstart', (e)=>{ e.preventDefault(); e.stopPropagation(); initAudio(); hardDrop(); });
            document.getElementById('softDropBtn').addEventListener('click', (e)=>{ e.stopPropagation(); initAudio(); softDrop(); });
            document.getElementById('hardDropBtn').addEventListener('click', (e)=>{ e.stopPropagation(); initAudio(); hardDrop(); });

            // Big centered button
            const bigActionBtn = document.getElementById('bigActionBtn');
            bigActionBtn.addEventListener('click', (e)=>{
                e.stopPropagation();
                if (!gameRunning) startGame();
                else if (gamePaused) togglePause();
            });

            // Pause button
            document.getElementById('mobilePauseBtn').addEventListener('click', (e)=>{ e.stopPropagation(); togglePause(); });

            // Desktop buttons
            document.getElementById('btnStart').addEventListener('click', startGame);
            document.getElementById('btnPause').addEventListener('click', togglePause);
            document.getElementById('btnRestart').addEventListener('click', startGame);

            // ===================== INIT =====================
            function initUI() {
                calcCellSize();
                initBoard();
                nextPiece=randomPiece();
                updateAllDisplays();
                drawBoard(); drawAllNext();
                document.getElementById('btnStart').style.display='block';
                document.getElementById('btnPause').style.display='none';
                document.getElementById('bigActionBtn').style.display='block';
                document.getElementById('bigActionBtn').textContent='Start';
                document.getElementById('mobilePauseBtn').style.display='none';
                document.getElementById('pauseBlur').style.display='none';
                gameRunning=false; gameOver=false; gamePaused=false;
                stopLongPress();
            }
            initUI();
            animationId=requestAnimationFrame(gameLoop);
        })();
    </script>
</body>
</html>

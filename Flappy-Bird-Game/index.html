<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a14">
    <title>Flappy Bird • ABDULLAH BIN FAHAD</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600;700;800&family=Caveat+Brush&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div class="hud-top">
        <div class="hud-item">
            <span class="hud-label">SCORE</span>
            <span class="hud-value" id="hudScore">0</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">LEVEL</span>
            <span class="hud-value hud-level" id="hudLevel">1</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">BEST</span>
            <span class="hud-value" id="hudBest">0</span>
        </div>
    </div>

    <div class="combo-display" id="comboDisplay"></div>
    <div class="level-message" id="levelMessage"></div>
    <div class="streak-indicator" id="streakIndicator"></div>

    <script src="script.js"></script>
</body>
</html>
